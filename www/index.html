<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dynamic Reading Jurnal</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e88e5">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&family=Poppins:wght@400;500;600&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#eef2ee;--card:#fff;--tx:#17302e;--mu:#667a77;--ac:#1d6b66;--ac2:#d9e8e4;--hl:#f3c93e;--bd:#d6e0dc}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0f1b1a;--card:#172625;--tx:#e6f0ed;--mu:#8fa6a2;--ac:#58c2b9;--ac2:#21393a;--hl:#f3c93e;--bd:#2a4140}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:640px;margin:0 auto;padding:16px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0}
h1{font-size:26px}h2{font-size:19px;margin:22px 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.sub{color:var(--mu);font-size:13px}
button{font:inherit;background:var(--ac);color:var(--bg);border:0;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.b2{background:var(--ac2);color:var(--tx)}.sm{padding:5px 10px;font-size:13px}.dg{background:transparent;color:#c0392b;border:1px solid var(--bd)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.st b{display:block;font:700 24px Fraunces,Georgia,serif}.st span{font-size:12px;color:var(--mu)}
.st.hl{background:var(--hl);color:#2b2300;border-color:var(--hl)}.st.hl span{color:#4d4100}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bk{position:relative;aspect-ratio:2/3;border-radius:4px 10px 10px 4px;overflow:hidden;cursor:pointer;box-shadow:inset 5px 0 0 rgba(0,0,0,.25);background:var(--ac2)}
.bk img,.cv{width:100%;height:100%;object-fit:cover}
.cv{display:flex;align-items:flex-end;padding:10px 8px;color:#fff;font:700 13px/1.2 Fraunces,Georgia,serif;word-break:break-word}
.bk i{position:absolute;top:6px;right:6px;font-style:normal;font-size:11px;background:var(--hl);color:#2b2300;border-radius:8px;padding:1px 7px;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;gap:12px}
.card .bk{width:60px;flex:none;aspect-ratio:2/3;cursor:default}.card .bd{flex:1;min-width:0}
.card h3{font-size:16px}.card p{margin:4px 0;font-size:13px;color:var(--mu);white-space:pre-wrap}
.pr{height:7px;background:var(--ac2);border-radius:5px;margin:8px 0 4px;overflow:hidden}.pr div{height:100%;background:var(--ac)}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chart{display:flex;align-items:flex-end;gap:6px;height:120px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mu)}
.chart u{display:block;width:100%;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal span{text-align:center;font-size:11px;color:var(--mu)}
.cal button{aspect-ratio:1;padding:0;background:var(--card);color:var(--tx);border:1px solid var(--bd);font-size:13px;font-weight:500;line-height:1.1}
.cal button small{display:block;font-size:9px;opacity:.8}
.cal button.t{outline:2px solid var(--hl)}
.empty{text-align:center;color:var(--mu);padding:28px 10px;border:1px dashed var(--bd);border-radius:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:9px 2px;font-size:11px;font-weight:500}
nav button b{display:block;font-size:19px}nav button.on{color:var(--ac)}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:13px;color:var(--mu);margin-top:10px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:8px;margin-top:3px}
.row{display:flex;gap:8px;margin-top:16px}.row button{flex:1}
.sc{display:flex;gap:8px;align-items:center}
.pv{width:80px;border-radius:6px;margin-top:6px;display:block}.pv[hidden]{display:none}
.stk{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--ac2);margin-bottom:6px}.stk i{display:block}
.vt{position:relative;display:block;width:112px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;flex:none}.vt img{width:100%;height:100%;object-fit:cover}
.vt s{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;font-size:22px;text-shadow:0 1px 6px #000}.vt em{position:absolute;left:5px;bottom:3px;font-size:10px;color:#fff;font-style:normal;text-shadow:0 1px 3px #000}
:root{--bg:#e4f2fc;--card:#fff;--tx:#0f2a44;--mu:#587791;--ac:#1e88e5;--ac2:#d0e7f9;--hl:#7fe3f4;--bd:#c3dbee;--sh:rgba(20,80,140,.16)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#09151f;--card:#12263a;--tx:#e3f1ff;--mu:#8ba9c3;--ac:#5db8ff;--ac2:#1b3752;--hl:#4fd8ee;--bd:#244662;--sh:rgba(0,0,0,.4);--on:#04121f}:root:not([data-theme=light]) .ic{background:linear-gradient(145deg,#2a5a88,#12263a);box-shadow:5px 6px 12px var(--sh),-2px -2px 6px rgba(120,190,255,.12),inset 0 -4px 0 rgba(0,0,0,.35)}}
body{font-family:var(--ff,Fredoka,"Trebuchet MS",system-ui,sans-serif);background-color:var(--bg);background-image:radial-gradient(120% 60% at 50% -10%,var(--ac2),transparent 70%);background-attachment:fixed;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,.st b,.cv{font-family:var(--ff,Fredoka,"Trebuchet MS",system-ui,sans-serif)}
h1{color:var(--ac);text-shadow:1px 1px 0 #0d5aa7,2px 2px 0 #0d5aa7,3px 3px 0 #0a4580,4px 6px 8px rgba(0,30,70,.3)}
h2{text-shadow:1px 1px 0 var(--ac2),2px 2px 0 var(--bd)}
.st b{color:var(--ac);text-shadow:1px 1px 0 var(--bd),2px 3px 4px var(--sh)}
.st.hl{background:var(--hl);color:#06283d;border-color:var(--hl)}.st.hl b{color:#06283d;text-shadow:1px 1px 0 rgba(255,255,255,.6)}.st.hl span{color:#0b4764}
.bk i{background:var(--hl);color:#06283d}
button{box-shadow:0 3px 0 rgba(8,60,115,.45),0 7px 10px var(--sh);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(8,60,115,.45)}
.top button:not(.b2):not(.dg),.acts button:not(.b2):not(.dg),#sv{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 80%,#fff),var(--ac));color:var(--on,#fff)}
.cal button{box-shadow:0 2px 0 var(--bd)}
.card,.st,.chart{box-shadow:0 8px 18px var(--sh),inset 0 1px 0 rgba(255,255,255,.5)}
.bk{box-shadow:inset 5px 0 0 rgba(0,0,0,.25),5px 8px 12px var(--sh)}
.ic{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:16px;font-size:24px;text-shadow:0 3px 3px rgba(0,0,0,.3);background:linear-gradient(145deg,#fff,#bfdcf3);box-shadow:5px 6px 12px var(--sh),-3px -3px 7px rgba(255,255,255,.8),inset 0 -4px 0 rgba(30,100,170,.25)}
.big{width:58px;height:58px;font-size:28px;border-radius:20px}
nav{left:calc(50% - 29px);right:auto;width:58px;height:58px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:none;border:0;padding:0;display:block}
nav button{flex:none;padding:0;background:none;color:var(--tx);box-shadow:none;border-radius:20px;font-size:13px}
nav .mi{position:absolute;left:50%;bottom:29px;display:flex;flex-direction:column;align-items:center;gap:4px;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,50%) scale(.3)}}
@media (prefers-reduced-motion:reduce){nav .mi{animation:none}}
nav .mi .lb{background:var(--card);padding:2px 8px;font-size:12px;white-space:nowrap;border-radius:12px;box-shadow:0 4px 10px var(--sh);color:var(--tx);font-weight:500}
nav .mi.on .lb{background:var(--ac);color:#fff}
nav button:active{transform:scale(.94);box-shadow:none}
h1,h2,.st b,.st.hl b{text-shadow:none}
main,.sheet{zoom:var(--zs,1)}
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:18px;margin-bottom:14px;border-radius:22px;color:var(--on,#fff);background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 60%,var(--hl)));box-shadow:0 10px 24px var(--sh)}
.hero::after{content:"";position:absolute;right:-34px;top:-34px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.16)}
.hi{flex:none;display:grid;place-items:center;width:58px;height:58px;font-size:32px;border-radius:18px;background:rgba(255,255,255,.25);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.ht{font:700 24px/1.15 var(--ff,Fredoka,sans-serif)}.rb{font-size:15px;font-weight:600;margin-bottom:3px}.hs{margin-top:5px;font-size:13px;opacity:.95}.hs b{font-size:20px;font-weight:600;letter-spacing:.5px}
.cc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px;box-shadow:0 8px 18px var(--sh)}.svg{width:100%;height:auto;display:block}
.dn{display:flex;align-items:center;gap:16px;justify-content:center}.lg{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0}.lg i{width:12px;height:12px;border-radius:4px;display:block}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;box-shadow:0 8px 18px var(--sh);cursor:pointer}.rc .bk{width:100%;margin-bottom:8px}.rc h3{font-size:15px}.rc p{font-size:12px;color:var(--mu);margin:6px 0 0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}.rs{color:#f0a500;letter-spacing:1px;font-size:14px}
</style></head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modal"></div>
<script>
const $=s=>document.querySelector(s);
let S={books:[],videos:[],wish:[],habit:{},goal:20,set:{theme:'Biru Sejuk',font:'Fredoka',size:'Sedang'}},tab='dash',hm=new Date();
try{const r=localStorage.getItem('drj');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('drj',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const HUE={Hijau:160,Biru:215,Merah:355,Ungu:275,Oranye:25};
const cover=b=>b.img?`<img src="${b.img}" alt="">`:`<div class="cv" style="background:${b.col=='Hitam'?'#222':`hsl(${HUE[b.col]??[...b.title].reduce((a,c)=>a+c.charCodeAt(0),0)*7%360} 38% 36%)`}"><div>${b.emo?`<span style="font-size:26px;display:block">${esc(b.emo)}</span>`:''}${esc(b.title)}</div></div>`;
const img=f=>new Promise(r=>{const fr=new FileReader();fr.onerror=()=>r(null);fr.onload=()=>{const i=new Image();i.onerror=()=>r(fr.result.length<1500000?fr.result:null);i.onload=()=>{try{const w=Math.min(300,i.width),c=document.createElement('canvas');c.width=w;c.height=Math.round(i.height*w/i.width);c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.75))}catch(e){r(null)}};i.src=fr.result};fr.readAsDataURL(f)});
const F={
books:[{k:'title',l:'Judul buku'},{k:'author',l:'Penulis'},{k:'year',l:'Tahun publikasi',t:'number'},{k:'pages',l:'Total halaman',t:'number'},{k:'cur',l:'Halaman terakhir dibaca',t:'number'},{k:'status',l:'Status',t:'select',o:['Sedang dibaca','Selesai']},{k:'rating',l:'Rating (0–5)',t:'number'},{k:'img',l:'Sampul foto (opsional)',t:'file'},{k:'review',l:'Review / ulasan buku',t:'area'},{k:'note',l:'Catatan atau kutipan',t:'area'}],
videos:[{k:'title',l:'Judul video'},{k:'ch',l:'Channel'},{k:'url',l:'Link video'},{k:'img',l:'Thumbnail (opsional, upload)',t:'file'},{k:'cat',l:'Kategori',t:'select',o:['Review buku','Rangkuman','Podcast','Kuliah','Lainnya']},{k:'rating',l:'Rating (0–5)',t:'number'},{k:'note',l:'Catatan / poin penting',t:'area'}],
wish:[{k:'title',l:'Judul buku'},{k:'author',l:'Penulis'},{k:'img',l:'Cover Buku (kirim file)',t:'file'},{k:'prio',l:'Prioritas',t:'select',o:['Tinggi','Sedang','Rendah']},{k:'price',l:'Harga',t:'rp'},{k:'note',l:'Alasan / di mana belinya',t:'area'}]};
function form(title,fields,vals,ok){
 const m=$('#modal');
 m.innerHTML=`<div class="sheet"><h3>${title}</h3>${fields.map(f=>`<label>${f.l}${f.t=='select'?`<select name="${f.k}">${f.o.map(o=>`<option ${vals[f.k]==o?'selected':''}>${o}</option>`).join('')}</select>`:f.t=='area'?`<textarea name="${f.k}" rows="3">${esc(vals[f.k])}</textarea>`:f.t=='rp'?`<input name="${f.k}" data-rp inputmode="numeric" placeholder="Rp 0" value="${vals[f.k]?rp(vals[f.k]):''}">`:f.t=='ro'?`<input name="${f.k}" readonly value="${vals.pages?Math.min(100,Math.round(vals.cur/vals.pages*100)):0}%">`:f.t=='file'?`<input type="file" name="${f.k}"><img class="pv" alt="" ${vals[f.k]?`src="${vals[f.k]}"`:'hidden'}>`:`<input name="${f.k}" type="${f.t||'text'}" ${f.t=='number'?'min="0" inputmode="numeric"':''} value="${esc(vals[f.k])}">`}</label>`).join('')}<div class="row"><button class="b2" id="cx">Batal</button><button id="sv">Simpan</button></div></div>`;
 m.className='on';
 m.querySelectorAll('input[type=file]').forEach(e=>e.onchange=async()=>{if(!e.files[0])return;const d=await img(e.files[0]),p=e.nextElementSibling;if(d){e._d=d;p.src=d;p.hidden=false}else alert('Gambar tidak bisa dibaca. Coba foto lain (JPG/PNG).')});
 $('#cx').onclick=()=>m.className='';m.oninput=e=>{if(e.target.dataset.rp!==undefined){const n=e.target.value.replace(/\D/g,'');e.target.value=n?'Rp '+n.replace(/\B(?=(\d{3})+(?!\d))/g,'.'):''}const c=m.querySelector('[name=cur]'),p=m.querySelector('[name=pages]'),r=m.querySelector('[name=prog]');if(c&&p&&r)r.value=(+p.value>0?Math.min(100,Math.round(c.value/p.value*100)):0)+'%'};m.onpaste=async e=>{const it=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith('image/')),fi=m.querySelector('input[type=file]');if(!it||!fi)return;const d=await img(it.getAsFile());if(d){fi._d=d;fi.nextElementSibling.src=d;fi.nextElementSibling.hidden=false}};
 m.onclick=e=>{if(e.target===m)m.className=''};
 $('#sv').onclick=async()=>{const o={};
  for(const f of fields){const e=m.querySelector(`[name=${f.k}]`);o[f.k]=f.t=='ro'?0:f.t=='rp'?+e.value.replace(/\D/g,'')||0:f.t=='file'?(e._d||vals[f.k]):f.t=='number'?+e.value||0:e.value}
  if(fields[0].t!='number'&&!String(o[fields[0].k]).trim()){e=m.querySelector('input');e.focus();return}
  ok(o);m.className='';save();render()};
}
function fix(col,o){if(col=='videos'&&o.url&&!/^https?:\/\//i.test(o.url))o.url='https://'+o.url;if(col=='books'){if(o.status=='Selesai'&&o.pages)o.cur=o.pages;else if(o.pages&&o.cur>=o.pages)o.status='Selesai';if(o.status=='Selesai'){if(!o.end)o.end=dk(new Date());o.done=o.end}else o.done='';if(o.status=='Sedang dibaca'&&!o.start)o.start=dk(new Date())}}
F.books=[{k:'title',l:'Judul Buku'},{k:'author',l:'Penulis'},{k:'img',l:'Cover Buku (kirim file)',t:'file'},{k:'year',l:'Tahun Publikasi',t:'number'},{k:'genre',l:'Genre',t:'select',o:['Fiksi','Non-fiksi','Fantasi','Romansa','Misteri','Sains','Sejarah','Biografi','Pengembangan diri','Bisnis','Agama','Lainnya']},{k:'cur',l:'Jumlah Halaman Dibaca',t:'number'},{k:'pages',l:'Total Halaman',t:'number'},{k:'start',l:'Tanggal Mulai',t:'date'},{k:'end',l:'Tanggal Selesai',t:'date'},{k:'prog',l:'Progress (otomatis)',t:'ro'},{k:'status',l:'Status',t:'select',o:['Belum dibaca','Sedang dibaca','Selesai']},{k:'rating',l:'Rating (0–5)',t:'number'},{k:'price',l:'Harga',t:'rp'},{k:'jenis',l:'Jenis Buku',t:'select',o:['Fisik','E-book','Audiobook']},{k:'own',l:'Kepemilikan',t:'select',o:['Milik sendiri','Pinjam','Perpustakaan','Hadiah']},{k:'review',l:'Review Buku',t:'area'}];
const NAME={books:'buku',videos:'video',wish:'wishlist'};
const add=c=>form('Tambah '+NAME[c],F[c],{},o=>{o.id=uid();o.date=dk(new Date());fix(c,o);S[c].unshift(o)});
const edit=(c,id)=>{const it=S[c].find(x=>x.id==id);form('Edit '+NAME[c],F[c],it,o=>{Object.assign(it,o);fix(c,it)})};
const del=(c,id)=>{const m=$('#modal');m.innerHTML=`<div class="sheet"><h3>Hapus item ini?</h3><p class="sub">Data yang dihapus tidak bisa dikembalikan.</p><div class="row"><button class="b2" id="cx">Batal</button><button id="ok" style="background:#d64545;color:#fff">Hapus</button></div></div>`;m.className='on';$('#cx').onclick=()=>m.className='';m.onclick=e=>{if(e.target===m)m.className=''};$('#ok').onclick=()=>{S[c]=S[c].filter(x=>x.id!=id);save();m.className='';render()}};
const startRead=id=>{const w=S.wish.find(x=>x.id==id);S.books.unshift({id:uid(),title:w.title,author:w.author,price:w.price||0,img:w.img,pages:0,cur:0,status:'Sedang dibaca',rating:0,note:w.note,date:dk(new Date())});S.wish=S.wish.filter(x=>x.id!=id);save();tab='books';render()};
function streak(){let d=new Date(),n=0;if(!S.habit[dk(d)])d.setDate(d.getDate()-1);while(S.habit[dk(d)]){n++;d.setDate(d.getDate()-1)}return n}
const setGoal=()=>form('Target harian',[{k:'goal',l:'Target membaca per hari (menit)',t:'number'}],{goal:S.goal},o=>{S.goal=Math.max(1,o.goal)});
const logDay=key=>form('Catat membaca '+key,[{k:'m',l:'Menit membaca',t:'number'},{k:'p',l:'Halaman dibaca',t:'number'}],S.habit[key]||{},o=>{if(o.m||o.p)S.habit[key]=o;else delete S.habit[key]});
const bars=a=>{const mx=Math.max(1,...a.map(d=>d.v));return `<div class="chart" style="gap:${a.length>10?2:6}px">${a.map(d=>`<div>${a.length<=8?`<span>${d.v||''}</span>`:''}<u style="height:${d.v/mx*75}%"></u>${d.l||'&nbsp;'}</div>`).join('')}</div>`};
const plat=u=>{try{const h=new URL(u).hostname.replace('www.','');return /youtu/.test(h)?'YouTube':/tiktok/.test(h)?'TikTok':/instagram/.test(h)?'Instagram':h}catch(e){return ''}};

const V={
dash(){

 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return{l:'SMTWTFS'[d.getDay()],m:(S.habit[dk(d)]||{}).m||0}});

 return `<div class="hero"><div class="hi">📖</div><div><div class="ht">Dynamic Reading Jurnal</div><div class="hs"><div class="rb">Ringkasan Bacaanmu</div><span id="dt"></span><br><b id="tm"></b></div></div></div>
 <div class="stats"><div class="st hl"><b>${streak()}</b><span>hari beruntun</span></div><div class="st"><b>${done}</b><span>buku selesai</span></div><div class="st"><b>${pg}</b><span>halaman dibaca</span></div><div class="st"><b>${S.books.filter(b=>b.status=='Sedang dibaca').length}</b><span>sedang dibaca</span></div><div class="st"><b>${S.videos.length}</b><span>video dicatat</span></div><div class="st"><b>${S.wish.length}</b><span>di wishlist</span></div></div>
 <h2>Menit membaca 7 hari terakhir</h2><div class="cc">${area(days.map(d=>({l:d.l,v:d.m})),S.goal)}</div><h2>Buku selesai per bulan</h2><div class="cc">${rbars(mons)}</div><h2>Komposisi bacaan</h2><div class="cc">${donut(comp)}</div><h2>Sebaran rating</h2><div class="cc">${rbars(rat)}</div>
 <h2>Galeri buku</h2>${S.books.length?`<div class="gal">${S.books.map(b=>`<div class="bk" onclick="edit('books','${b.id}')" title="${esc(b.title)}">${cover(b)}${b.status=='Selesai'?'<i>Selesai</i>':''}</div>`).join('')}</div>`:empty('Galeri masih kosong. Tambah buku pertamamu di tab Buku.')}`},
books(){return `<div class="top"><h1>Reading Log</h1><button onclick="add('books')">+ Buku</button></div>`+(S.books.length?[...S.books].sort((a,b)=>(a.status=='Selesai')-(b.status=='Selesai')).map(b=>{const p=b.pages?Math.min(100,Math.round(b.cur/b.pages*100)):0;return `<div class="card"><div class="bk">${cover(b)}</div><div class="bd"><h3>${esc(b.title)}</h3><div class="sub">${esc(b.author)}${b.year?' · '+b.year:''}${b.genre?' · '+esc(b.genre):''} ${b.rating?'· '+stars(b.rating):''}</div><div class="sub">${[b.jenis,b.own,b.price?rp(b.price):''].filter(Boolean).map(esc).join(' · ')}</div><div class="pr"><div style="width:${p}%"></div></div><div class="sub">${esc(b.status)} · Hal. ${b.cur}${b.pages?' / '+b.pages:''} (${p}%)</div><div class="sub">${b.start?'Mulai '+b.start:''}${b.end?' · Selesai '+b.end:''}</div>${(b.review||b.note)?`<p>${esc(b.review||b.note)}</p>`:''}${btns('books',b.id)}</div></div>`}).join(''):empty('Belum ada buku. Ketuk “+ Buku” untuk mulai mencatat.'))},
videos(){return `<div class="top"><h1>Video Log</h1><button onclick="add('videos')">+ Video</button></div>`+(S.videos.length?S.videos.map(v=>`<div class="card"><div>${vthumb(v)}</div><div class="bd"><h3>${esc(v.title)}</h3><div class="sub">${esc(v.cat)} · ${esc(v.ch)} · ${v.date} ${v.rating?'· '+stars(v.rating):''}</div>${v.note?`<p>${esc(v.note)}</p>`:''}${btns('videos',v.id)}</div></div>`).join(''):empty('Belum ada video. Catat video buku atau podcast yang kamu tonton.'))},
wish(){const o={Tinggi:0,Sedang:1,Rendah:2};return `<div class="top"><h1>Wishlist</h1><button onclick="add('wish')">+ Buku</button></div>`+(S.wish.length?[...S.wish].sort((a,b)=>o[a.prio]-o[b.prio]).map(w=>`<div class="card"><div class="bk">${cover(w)}</div><div class="bd"><h3>${esc(w.title)}</h3><div class="sub">${esc(w.author)} · Prioritas ${esc(w.prio).toLowerCase()}${w.price?' · '+rp(w.price):''}</div>${w.note?`<p>${esc(w.note)}</p>`:''}${btns('wish',w.id,`<button class="sm" onclick="startRead('${w.id}')">Mulai baca</button>`)}</div></div>`).join(''):empty('Wishlist kosong. Simpan buku yang ingin kamu baca nanti.'))},
rev(){const L=S.books.filter(b=>b.rating||b.review).sort((a,b)=>b.rating-a.rating),R=L.filter(b=>b.rating),avg=R.length?(R.reduce((a,b)=>a+(+b.rating||0),0)/R.length).toFixed(1):'–';return `<div class="top"><div><h1>Books Gallery Review</h1><div class="sub">${L.length} buku diulas · rata-rata ★ ${avg}</div></div></div>`+(L.length?`<div class="rg">${L.map(b=>`<div class="rc" onclick="edit('books','${b.id}')"><div class="bk">${cover(b)}</div><h3>${esc(b.title)}</h3><div class="sub">${esc(b.author)}${b.year?' · '+b.year:''}</div><div class="rs">${stars(b.rating)||'Belum dirating'}</div><p>${esc(b.review||'Belum ada ulasan. Ketuk untuk menulis.')}</p></div>`).join('')}</div>`:empty('Belum ada review. Beri rating dan tulis ulasan saat menambah atau mengedit buku.'))},
set(){const s=S.set||{},grp=(t,k,o)=>`<h2>${t}</h2><div class="acts">${Object.keys(o).map(n=>`<button class="${s[k]==n?'':'b2'} sm" onclick="pick('${k}','${n}')">${n}</button>`).join('')}</div>`;return `<div class="top"><h1>Pengaturan</h1></div>`+grp('Ubah Tema','theme',THEMES)+grp('Jenis Font','font',FONTS)+grp('Ukuran Font','size',SIZES)+remUI()+`<h2>Pratinjau</h2><div class="card"><div class="bd"><h3>Judul Buku Contoh</h3><div class="sub">Penulis · 2024</div><p>Beginilah tampilan teks dengan pengaturanmu.</p></div></div><div class="sub">Pengaturan tersimpan otomatis di browser ini.</div>`},
habit(){
 const y=hm.getFullYear(),m=hm.getMonth(),n=new Date(y,m+1,0).getDate(),off=new Date(y,m,1).getDay(),td=dk(new Date());
 let cells='',tot=0,dn=0;

  const a=h?Math.min(1,(h.m||1)/S.goal):0;

 return `<div class="top"><h1>Habit Tracker</h1><div class="acts" style="margin:0"><button class="b2 sm" onclick="setGoal()">Target ${S.goal} mnt</button><button class="b2 sm" onclick="logDay('${td}')">Catat hari ini</button></div></div>
 <div class="stats"><div class="st hl"><b>${streak()}</b><span>hari beruntun</span></div><div class="st"><b>${dn}</b><span>hari aktif bulan ini</span></div><div class="st"><b>${tot}</b><span>menit bulan ini</span></div></div>
 <div class="top" style="margin-top:18px"><button class="b2 sm" onclick="hm=new Date(${y},${m-1},1);render()">‹</button><h2 style="margin:0">${hm.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</h2><button class="b2 sm" onclick="hm=new Date(${y},${m+1},1);render()">›</button></div>
 <div class="cal">${[...'MSSRKJS'].map(d=>`<span>${d}</span>`).join('')}${'<i></i>'.repeat(off)}${cells}</div>
 <h2>Menit per hari</h2>${bars(dm)}<h2>Total per minggu</h2>${bars(wk)}<div class="sc" style="margin-top:14px"><div class="sub" style="flex:1">Target harian: ${S.goal} menit. Warna makin pekat saat mendekati target.</div><button class="b2 sm" onclick="setGoal()">Ubah target</button></div>`}};
const TABS=[['dash','🏠','Dashboard'],['books','📚','Buku'],['videos','🎬','Video'],['wish','⭐','Wishlist'],['habit','🔥','Habit'],['set','⚙️','Pengaturan']];
const THEMES={'Biru Sejuk':null,'Hijau Mint':{'--bg':'#e7f5ee','--card':'#fff','--tx':'#10302a','--mu':'#5a7d72','--ac':'#1f9d78','--ac2':'#d2eee2','--hl':'#9be8c8','--bd':'#c3e0d2','--sh':'rgba(20,110,80,.16)','--on':'#fff'},'Ungu Lavender':{'--bg':'#f0ecfa','--card':'#fff','--tx':'#271a47','--mu':'#74689a','--ac':'#7b5cd6','--ac2':'#e1d9f7','--hl':'#d9c9ff','--bd':'#d6cdef','--sh':'rgba(90,60,170,.16)','--on':'#fff'},'Merah Muda':{'--bg':'#fdeef3','--card':'#fff','--tx':'#401528','--mu':'#8f6074','--ac':'#e0457b','--ac2':'#fbd9e5','--hl':'#ffc2d6','--bd':'#f2cbd9','--sh':'rgba(190,40,100,.16)','--on':'#fff'},'Gelap Malam':{'--bg':'#0c0f14','--card':'#171c24','--tx':'#e8edf5','--mu':'#8d99ab','--ac':'#6ea8ff','--ac2':'#222b38','--hl':'#5ed6c8','--bd':'#2a3342','--sh':'rgba(0,0,0,.5)','--on':'#06121f'}};

function applySet(){const s=S.set||{},r=document.documentElement.style;for(const k of['--bg','--card','--tx','--mu','--ac','--ac2','--hl','--bd','--sh','--on'])r.removeProperty(k);const t=THEMES[s.theme];if(t)for(const k in t)r.setProperty(k,t[k]);r.setProperty('--ff',FONTS[s.font]||FONTS.Fredoka);r.setProperty('--zs',SIZES[s.size]||1)}

}
try{const c=document.createElement('canvas');c.width=c.height=192;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,192,192);g.addColorStop(0,'#4aa8ff');g.addColorStop(1,'#1e6fd0');x.fillStyle=g;x.fillRect(0,0,192,192);x.font='110px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('📖',96,104);const u=c.toDataURL('image/png');for(const r of['apple-touch-icon','icon']){const l=document.createElement('link');l.rel=r;l.href=u;document.head.appendChild(l)}}catch(e){}

const setRem=async on=>{if(LN){try{if(on){const p=await LN.requestPermissions();if(p.display!=='granted'){alert('Izin notifikasi ditolak. Aktifkan lewat Pengaturan HP.');return}const t=(S.rem.time||'20:00').split(':').map(Number);await LN.cancel({notifications:[{id:1}]});await LN.schedule({notifications:[{id:1,title:'Waktunya membaca \uD83D\uDCD6',body:'Catat bacaanmu hari ini di Dynamic Reading Jurnal.',schedule:{on:{hour:t[0],minute:t[1]},allowWhileIdle:true}}]})}else await LN.cancel({notifications:[{id:1}]})}catch(e){alert('Gagal mengatur pengingat: '+e)}S.rem.on=on;save();render();return}if(on){if(!('Notification' in window)){alert('Browser ini tidak mendukung notifikasi.');return}const p=await Notification.requestPermission();if(p!=='granted'){alert('Izin notifikasi ditolak. Aktifkan lewat pengaturan situs di browser.');return}const r=await swReg();try{if(r&&r.periodicSync)await r.periodicSync.register('drj-remind',{minInterval:3600000})}catch(e){}}S.rem.on=on;save();syncMeta();render()};
